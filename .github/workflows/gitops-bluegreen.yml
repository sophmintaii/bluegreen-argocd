name: Blue/Green GitOps CI/CD (ArgoCD)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: sofiikam/hello-bluegreen

jobs:
  ci:
    name: Test, build & push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements.txt pytest
      - name: Run unit tests
        working-directory: app
        run: pytest
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  cd:
    name: Update manifests for ArgoCD
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Point the Rollout at the new image
        run: |
          sed -i "s|image: .*|image: $IMAGE:$GITHUB_SHA|" k8s/rollout.yaml
          grep "image:" k8s/rollout.yaml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${GITHUB_SHA::7} [skip ci]"
          git push
