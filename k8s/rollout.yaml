apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: sofiikam/hello-bluegreen:3eedcab35b5195eb6689cb8246604a80af202dde
          ports:
            - name: http
              containerPort: 8050
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
  strategy:
    blueGreen:
      activeService: hello-active
      previewService: hello-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
